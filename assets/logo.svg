<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640" role="img" aria-labelledby="title desc">
<title id="title">World Wellbeing Forum — runners logo</title>
<desc id="desc">Four green running figures inside a fine gold circle, beside the words World Wellbeing Forum in gold.</desc>
<circle cx="320" cy="320" r="302" fill="#fff" stroke="#c8a45a" stroke-width="12"/>
<g fill="#76bd43" stroke="#76bd43" stroke-linecap="round" stroke-linejoin="round">
<!-- lead runner -->
<circle cx="110" cy="214" r="24"/><path stroke-width="27" d="M108 245 Q90 280 81 321 L52 365 M89 286 L145 306 L177 280 M82 320 L118 375 L94 437 M118 375 L171 403 L195 390"/>
<!-- second runner -->
<circle cx="197" cy="225" r="22"/><path stroke-width="25" d="M194 252 L177 310 L205 350 M181 289 L228 302 L259 279 M204 349 L185 404 L211 447 M205 350 L249 383 L279 371"/>
<!-- third runner -->
<circle cx="278" cy="326" r="18"/><path stroke-width="21" d="M277 348 L261 391 L286 421 M265 373 L310 383 L335 360 M285 420 L269 460 L292 482 M286 420 L324 443 L348 432"/>
<!-- small child runner -->
<circle cx="354" cy="405" r="15"/><path stroke-width="18" d="M353 423 L341 456 L359 478 M345 444 L380 451 L400 433 M359 478 L350 507 L372 520 M359 478 L391 493 L410 483"/>
</g>
<g fill="#c8a45a" font-family="Georgia, 'Times New Roman', serif" text-anchor="middle">
<text x="440" y="245" font-size="48" letter-spacing="2">WORLD</text>
<text x="445" y="306" font-size="42" font-weight="bold" letter-spacing="1">WELLBEING</text>
<text x="440" y="365" font-size="48" letter-spacing="2">FORUM</text>
</g>
</svg>